# Virtual host para agencia-viajes.idgs8-2.tech
#
# Instalar en el VPS:
#   sudo cp deploy/nginx.agencia-viajes.conf /etc/nginx/sites-available/agencia-viajes
#   sudo ln -s /etc/nginx/sites-available/agencia-viajes /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d agencia-viajes.idgs8-2.tech
#
# Ajusta la ruta de "root" abajo a donde quede el checkout real del repo en
# el VPS (frontend ya compilado: npm run build -w apps/frontend).
server {
    listen 80;
    server_name agencia-viajes.idgs8-2.tech;

    # Frontend: build estatico servido directo por Nginx, sin pasar por Node.
    root /home/terreneitor370/agencia-viajes/apps/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend: proxy al contenedor Docker (network_mode: host, ver
    # docker-compose.yml -- el backend ata su puerto directo a 127.0.0.1,
    # PORT=3005 en apps/backend/.env.production). Sin reescribir la ruta: el
    # backend ya monta sus modulos bajo /api/v1/... asi que se reenvia tal cual.
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
