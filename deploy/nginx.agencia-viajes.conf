# Virtual host para agencia-viajes.idgs8-2.tech
#
# Este archivo YA INCLUYE el bloque HTTPS que agrega Certbot (las lineas
# marcadas "managed by Certbot" abajo) -- se capturo del servidor real
# despues de correr certbot una vez. NO se necesita volver a correr
# certbot en cada deploy: con solo copiar este archivo y recargar Nginx
# basta. Si algun dia hay que tocar el bloque SSL a mano, ver el
# historial de este archivo para lo que se perdio la primera vez que
# esto paso: un "cp" de una version vieja (sin el bloque SSL) sobre este
# archivo borro el HTTPS en produccion sin avisar, y el navegador -- que
# ya traia HSTS guardado de una visita anterior -- se conecto por 443 de
# todas formas, cayendo en el sitio de otro compañero que si tenia ese
# puerto configurado en este VPS compartido. Instalar (primera vez, o si
# certbot necesita volver a correr por otra razon):
#   sudo cp deploy/nginx.agencia-viajes.conf /etc/nginx/sites-available/agencia-viajes
#   sudo ln -s /etc/nginx/sites-available/agencia-viajes /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Ajusta la ruta de "root" abajo a donde quede el checkout real del repo en
# el VPS (frontend ya compilado: npm run build -w apps/frontend).
server {
    server_name agencia-viajes.idgs8-2.tech;

    # Frontend: build estatico servido directo por Nginx, sin pasar por Node.
    root /home/terreneitor370/agencia-viajes/apps/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html nunca debe quedarse en cache del navegador: es el unico
        # archivo que no cambia de nombre entre builds (los de /assets/ si,
        # llevan hash en el nombre), asi que sin esto un navegador podria
        # seguir usando una version vieja de la app despues de un deploy.
        add_header Cache-Control "no-cache";
    }

    # Los archivos de /assets/ llevan hash en el nombre (ej. index-bQoEZaPV.js):
    # si cambia el contenido, cambia el nombre. Por eso si se pueden cachear
    # agresivo -- un cache viejo nunca sirve un archivo con contenido nuevo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend: proxy al contenedor Docker (network_mode: host, ver
    # docker-compose.yml -- el backend ata su puerto directo a 127.0.0.1,
    # PORT=3005 en apps/backend/.env.production). Sin reescribir la ruta: el
    # backend ya monta sus modulos bajo /api/v1/... asi que se reenvia tal cual.
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/agencia-viajes.idgs8-2.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/agencia-viajes.idgs8-2.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = agencia-viajes.idgs8-2.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name agencia-viajes.idgs8-2.tech;
    return 404; # managed by Certbot
}
